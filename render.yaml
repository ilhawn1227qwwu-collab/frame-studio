services:
  - type: web
    name: frame-studio-private
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: FRAME_PUBLIC_MODE
        value: "1"
      - key: FRAME_SITE_PASSWORD
        sync: false
      - key: FRAME_MAX_DURATION
        value: "7200"
      - key: FRAME_MAX_FILE_BYTES
        value: "367001600"
      - key: FRAME_MAX_ACTIVE_JOBS
        value: "1"
