name: Kali tour smoke test
on:
  push:
    branches: [kali-sim-lab]
  workflow_dispatch:
jobs:
  guided-tour:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser automation
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start local web server
        run: python3 -m http.server 8000 --directory public >/tmp/kali-server.log 2>&1 &
      - name: Run complete interactive tutorial
        run: node tests/tour-smoke.cjs
      - name: Run guided security lab coaching
        run: node tests/lab-guide-smoke.cjs
      - name: Test Kali multi-course Learning Center
        run: node tests/curriculum-smoke.cjs
      - name: Verify filesystems and negative-case Wi-Fi integrity
        run: node tests/integrity-smoke.cjs
      - name: Test shared LAN, virtual Firefox and incident/free practice
        run: node tests/virtual-lan-smoke.cjs
      - name: Test offline state, separate client and station, and WPA3 recovery
        run: node tests/state-transitions-smoke.cjs
